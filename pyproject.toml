[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flask-sitecopy"
version = "0.1.0"
description = "Edit every string on a Flask site from an admin panel, without a deploy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Camilo Romero" }]
keywords = ["flask", "cms", "content", "copy", "editor", "i18n"]
classifiers = [
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Flask>=2.2",
    "MarkupSafe>=2.0",
]

[project.optional-dependencies]
sqlalchemy = ["Flask-SQLAlchemy>=3.0"]
test = [
    "Flask-SQLAlchemy>=3.0",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/CROCDC/flask-sitecopy"
Source = "https://github.com/CROCDC/flask-sitecopy"

[tool.hatch.build.targets.wheel]
packages = ["src/sitecopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
