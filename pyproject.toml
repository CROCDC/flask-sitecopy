[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flask-sitecopy"
version = "0.1.0"
description = "Edit every string on a Flask site from an admin panel, without a deploy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Camilo Romero" }]
keywords = ["flask", "cms", "content", "copy", "editor", "i18n"]
classifiers = [
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Flask>=2.2",
    "MarkupSafe>=2.0",
]

[project.optional-dependencies]
sqlalchemy = ["Flask-SQLAlchemy>=3.0"]
# Unit + integration + property-based, plus coverage. This is what CI installs for the
# default `pytest` run.
test = [
    "Flask-SQLAlchemy>=3.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]
# The browser E2E suite (tests/e2e/), kept separate so the default run needs no browser.
e2e = [
    "pytest-playwright>=0.4",
    "axe-playwright-python>=0.1",  # bundles axe-core for the a11y checks (offline)
]

[project.urls]
Homepage = "https://github.com/CROCDC/flask-sitecopy"
Source = "https://github.com/CROCDC/flask-sitecopy"

[tool.hatch.build.targets.wheel]
packages = ["src/sitecopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The E2E suite needs a browser (installed only in CI's e2e job), so the default `pytest`
# run — what a contributor gets locally — skips it by marker. Run it explicitly with
# `pytest tests/e2e -m e2e` (the trailing -m overrides this default).
addopts = '-m "not e2e"'
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: browser end-to-end test (needs Playwright + Chromium)",
]

[tool.coverage.run]
branch = true
source = ["sitecopy"]

[tool.coverage.report]
# Branch coverage (stricter than line coverage) on the current baseline. This is a
# ratchet: it only moves up. Each testing phase that lands raises it toward the ≥97%
# target in docs/TESTING.md.
fail_under = 93
show_missing = true
