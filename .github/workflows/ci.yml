name: CI

on:
  push:
    # main is covered by the Release workflow's own test gate, so it isn't double-run
    # here; every other branch (develop, feature branches) runs CI on push.
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Unit + integration + property tests (with coverage)
        # Coverage gate (fail_under) lives in pyproject; --cov-fail-under here is belt
        # and braces so a config drift can't silently drop the floor.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=98

  e2e:
    name: e2e (editor, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[test,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Editor end-to-end suite
        run: pytest tests/e2e -m e2e
